services:
  - type: web
    name: globetrotter-app
    env: node
    buildCommand: "npm install && npm run build:all"
    startCommand: "cd server && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: globetrotter-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000

databases:
  - name: globetrotter-db
    databaseName: globetrotter
    user: globetrotter_user
