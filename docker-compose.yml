services:
  db:
    image: postgres:16-alpine
    container_name: globetrotter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-globetrotter}
    ports:
      - "5432:5432"
    volumes:
      - globetrotter_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-globetrotter}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  globetrotter_pgdata:
